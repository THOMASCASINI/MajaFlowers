<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>1 nuovo messaggio</title>
  <meta name="theme-color" content="#0f1420">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='23' fill='%2334c759'/><path d='M50 24c-17 0-30 11-30 25 0 8 4 15 11 19-1 4-3 7-6 9 6 0 11-2 15-5 3 1 7 1 10 1 17 0 30-11 30-24S67 24 50 24z' fill='white'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="home" id="home">
    <p class="hello">Ciao Maja,</p>
    <h1>c'è un messaggio per te</h1>

    <button class="app" id="open" type="button" aria-label="Apri Messaggi: 1 nuovo messaggio">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <path d="M50 22c-18.200 0-33 12.100-33 27 0 8.900 5.300 16.800 13.400 21.700-0.900 4.200-3.200 7.900-6.500 10.400 6.800-0.100 12.700-2.400 17.100-6.100 2.900 0.700 5.900 1 9 1 18.200 0 33-12.100 33-27S68.200 22 50 22z" fill="#fff"/>
        </svg>
        <span class="badge" id="badge">1</span>
      </span>
      <span class="label">Messaggi</span>
    </button>
  </main>

  <div class="player" id="player" hidden>
    <video
      id="vlog"
      src="media/vlog.mp4"
      preload="metadata"
      playsinline
      controls
      controlslist="nodownload"
    ></video>
    <button class="close" id="close" type="button" aria-label="Chiudi">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      </svg>
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
